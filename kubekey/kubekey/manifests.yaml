
download:
  kubernetes:
    kube_version: []
    helm_version: []
  etcd:
    etcd_version: []
  image_registry:
    type: []
    # ========== image registry ==========
    # keepalived image tag. Used for load balancing when there are multiple image registry nodes.
    keepalived_version: []
# docker-compose binary
    dockercompose_version: []
    # ========== image registry: harbor ==========
    # harbor image tag
    harbor_version: []
    # ========== image registry: docker-registry ==========
    # docker-registry image tag
    docker_registry_version: []
  cri:
    # Container runtime type.
    container_manager: []
    # ========== cri ==========
    # crictl binary
    crictl_version: []
    # ========== cri: docker ==========
    # docker binary
    docker_version: []
    # cridockerd. Required when kube_version is greater than 1.24
    cridockerd_version: []
    # ========== cri: containerd ==========
    # containerd binary
    containerd_version: []
    # runc binary
    runc_version: []
  cni:
    type: []
    # ========== cni ==========
    # cni_plugins binary
    cni_plugins_version: []
    # ========== cni: calico ==========
    # calicoctl binary
    calico_version: []
    # ========== cni: cilium ==========
    # cilium helm
    cilium_version: []
    # ========== cni: flannel ==========
    # flannel helm
    flannel_version: []   
    # ========== cni: hybridnet ==========
    # hybridnet helm
    hybridnet_version: []
    # ========== cni: kubeovn ==========
    # kubeovn helm
    kubeovn_version: []
    # ========== cni: muti-cni ==========
    multi_cni: null
    # ========== cni: multi-cni - multus ==========
    # Image tag for Multus (configure if needed).
    multus:
      image:  
        repository: "k8snetworkplumbingwg/multus-cni"
        tag: ["v4.2.4"]
  storage_class:
    # Local storage class settings.
    local:
      enabled: true   # Enable the local storage class.
    # openebs/dynamic-localpv-provisioner helm chart version.
    localpv_provisioner_version: ["4.4.0"]
    nfs:
      enabled: false   # Enable the nfs storage class.
    # nfs-provisioner Helm chart version.
    nfs_provisioner_version: ["4.0.18"]
  iso: ["almalinux-9.0-rpms","centos-8-rpms","debian-10-debs","debian-11-debs","kylin-v10SP3-2403-rpms","kylin-v10SP3-rpms","kylin-v10SP2-rpms","kylin-v10SP1-rpms","ubuntu-18.04-debs","ubuntu-20.04-debs","ubuntu-22.04-debs","ubuntu-24.04-debs"]
  images:
    manifests:
