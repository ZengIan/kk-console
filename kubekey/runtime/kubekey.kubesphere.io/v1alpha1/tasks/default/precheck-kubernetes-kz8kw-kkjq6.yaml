  module:
    args:
      fail_msg: The configured maximum number of pods per node exceeds the number
        of available IPv6 addresses in the pod CIDR range.
      that: le (.kubernetes.kubelet.max_pods | default 110) (sub (pow 2 (float64 (sub
        128 (.cni.ipv4_mask_size | default 64)))) 2)
    name: assert
  name: Network | Ensure enough IPv6 addresses are available for pods
  when:
  - '{{ .inventory_hostname | ne "localhost" }}'
  - '{{ .groups.k8s_cluster | default list | has .inventory_hostname }}'
  - '{{ .cni.pod_cidr | default "10.233.64.0/18" | splitList "," | last | ipFamily
