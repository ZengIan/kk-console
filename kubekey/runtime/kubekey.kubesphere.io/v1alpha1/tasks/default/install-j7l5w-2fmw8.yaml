spec:
  DelegateTo: ""
  hosts:
  - 47-253-179-114
  loop: null
  module:
    args:
      hosts: all
      vars:
        installed_etcd: |-
          {{- $installed := list -}} {{- range .groups.etcd -}}
            {{- if and ((index $.hostvars . "etcd_install_LoadState" "stdout") | eq "loaded") ($.delete_nodes | default list | has . | not) -}}
              {{- $installed = append $installed . -}}
            {{- end -}}
          {{- end -}} {{ $installed | first | default "" }}
        need_installed_etcd: |-
          {{- $needInstalled := list -}} {{- range .groups.etcd -}}
            {{- if and ((index $.hostvars . "etcd_install_LoadState" "stdout") | eq "not-found") ($.delete_nodes | default list | has . | not) -}}
              {{- $needInstalled = append $needInstalled . -}}
            {{- end -}}
          {{- end -}} {{ $needInstalled | toJson }}
        need_uninstall_etcd: "{{- $needUnInstalled := list -}} {{- range .groups.etcd
          -}}\n  {{- if $.delete_nodes | default list | has . -}}\n    {{- $needUnInstalled
          = append $needUnInstalled . -}}\n  {{- end -}}\n{{- end -}} {{ $needUnInstalled
          | toJson }}            "
    name: add_hostvars
  name: Prepare | Detect installed, to-install, and to-remove etcd nodes
  when:
  - '{{ .etcd.deployment_type | eq "external" }}'
